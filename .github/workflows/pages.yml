name: Web installer (GitHub Pages)

# Builds the release firmware and publishes the browser installer with the full image beside it.
# Release assets can't be fetched by the page (GitHub sends no CORS headers for them), so the image
# lives on Pages itself.
on:
  workflow_dispatch:
  push:
    tags: ["*"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          # Same as ci.yml.
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-pages-${{ hashFiles('platformio.ini') }}

      - name: Pin pioarduino core inside the platform penv
        run: |
          pio pkg install -e x4pro-gh_release
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"

      - name: Build release firmware
        run: pio run -e x4pro-gh_release -j1

      - name: Assemble site
        run: |
          VERSION=$(grep -m1 '^version' platformio.ini | sed 's/.*= *//')
          mkdir -p public
          cp site/* public/
          cp .pio/build/x4pro-gh_release/firmware.factory.bin public/vaultink-x4pro-factory.bin
          cat > public/manifest.json <<EOF
          {
            "name": "VaultInk",
            "version": "${VERSION}",
            "built": "$(date -u +%Y-%m-%d)",
            "new_install_prompt_erase": true,
            "builds": [
              { "chipFamily": "ESP32-S3", "parts": [ { "path": "vaultink-x4pro-factory.bin", "offset": 0 } ] }
            ]
          }
          EOF

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

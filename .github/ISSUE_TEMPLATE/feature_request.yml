name: Feature Request
description: Propose a new feature or change to VaultInk
title: "Short, descriptive title of the request"
labels: ["enhancement", "needs-scope-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to propose a change to VaultInk!

        **Please read [SCOPE.md](https://github.com/Somnius/VaultInk/blob/main/SCOPE.md) and [ROADMAP.md](https://github.com/Somnius/VaultInk/blob/main/ROADMAP.md) first.**
        Many ideas are already planned for a later phase.

        Reading problems that also happen in CrossPoint Reader are better reported
        [upstream](https://github.com/crosspoint-reader/crosspoint-reader/issues), so every fork gets the fix.

  - type: checkboxes
    id: scope-check
    attributes:
      label: Scope check (required)
      options:
        - label: I have read SCOPE.md and ROADMAP.md.
          required: true
        - label: This is for the Xteink X4 Pro (VaultInk does not support other devices).
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem this solves
      description: What do you want to do with your books or vault that you can't do now? Be concrete.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you change? Focus on what you would see on the device.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else relevant (links, screenshots, an example note or canvas without private content).
    validations:
      required: false
